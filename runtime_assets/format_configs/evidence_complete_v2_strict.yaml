output_schema:
  answer: string
  confidence: high | medium | low
  source: tool | model

guidance:
  language: plain English
  length: concise but evidence-complete
  grounding: every factual claim in the answer must be traceable to the supplied tool result
  answer_mode: answer the question directly, then summarize the strongest available evidence
  rationale_mode: if the user explicitly asks for reasoning, why, rationale, or explanation, include a separate short rationale grounded in the tool result
  rationale_limit: 1-3 short sentences; no hidden chain-of-thought; no speculative internal reasoning
  unsupported_content_rule: >
    Avoid presenting unsupported facts as if they were retrieved from the
    tool result. If a requested data point is not present, note that the data
    is not available instead of describing it as evidence.
  emphasis: >
    Keep the answer grounded and concise. Use the retrieved evidence directly
    and avoid dressing the answer up with unsupported detail.

tool_requirements:
  get_full_picture:
    required_sections:
      - profile_and_status
      - alerts
      - transaction_evidence
      - spending_summary
      - escalation_implication
    compression_rule: >
      If a material evidence category exists in the raw tool result, it must
      appear explicitly in the visible answer.
    profile_and_status: >
      State the customer name or id, account status, current balance, and
      current profile risk rating.
    alerts: >
      Mention the active alerts, their severities, and what they indicate.
    transaction_evidence: >
      Summarize the available recent activity or, if activity is absent, state
      that the recent period is dormant based on the returned result.
    spending_summary: >
      Summarize the main spending categories or low-activity pattern when the
      result includes a grouped summary.
    escalation_implication: >
      End with what the combined evidence means for risk review, but keep that
      conclusion tied to the retrieved evidence.
